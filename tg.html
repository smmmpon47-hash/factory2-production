<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โรงงาน 2 • ตั้งเป้าการผลิตประจำวัน</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;font-family:'Sarabun',sans-serif}
    body{
      background:#1e3a3f;
      min-height:100vh;
      margin:0;
      padding:20px 15px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      color:#0f172a;
    }
    .card{
      width:100%;
      max-width:500px;
      background:#fff;
      border-radius:24px;
      padding:28px 24px;
      box-shadow:0 20px 40px rgba(0,0,0,.25);
    }
    .factory-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#ecfdf5;
      border:1px solid #a7f3d0;
      color:#047857;
      font-size:.78rem;
      font-weight:700;
      padding:5px 10px;
      border-radius:999px;
      margin-bottom:10px;
    }
    .header-title{
      margin:0 0 20px;
      text-align:center;
      color:#0d9488;
      font-size:1.55rem;
      font-weight:700;
    }
    .user-banner{
      background:#f0fdf4;
      border:1px solid #bbf7d0;
      border-radius:14px;
      padding:9px 12px;
      margin-bottom:18px;
      text-align:center;
      color:#166534;
      font-size:.86rem;
      font-weight:600;
    }
    .form-group{margin-bottom:18px}
    label{
      display:block;
      margin-bottom:7px;
      font-size:1rem;
      font-weight:600;
      color:#1e293b;
    }
    select,input{
      width:100%;
      min-height:50px;
      padding:12px 14px;
      border:1.8px solid #cbd5e1;
      border-radius:14px;
      background:#fff;
      color:#0f172a;
      font-size:1.04rem;
      outline:none;
    }
    select:focus,input:focus{
      border-color:#0d9488;
      box-shadow:0 0 0 3.5px rgba(13,148,136,.16);
    }
    .lot-card{
      background:#f8fafc;
      border:1.5px solid #cbd5e1;
      border-radius:18px;
      padding:17px;
      margin-bottom:18px;
    }
    .lot-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
      font-weight:700;
    }
    .rate-badge{
      background:#e0f2fe;
      color:#0369a1;
      padding:5px 10px;
      border-radius:10px;
      font-size:.82rem;
      white-space:nowrap;
    }
    .lot-info{
      display:none;
      margin-top:10px;
      padding:12px 13px;
      background:#ecfeff;
      border:1px solid #a5f3fc;
      border-radius:13px;
    }
    .lot-info.show{display:block}
    .lot-info-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:3px 0;
      font-size:.84rem;
    }
    .lot-info-row span:first-child{color:#64748b}
    .lot-info-row strong{
      color:#0f766e;
      text-align:right;
      overflow-wrap:anywhere;
    }
    .lot-status{
      min-height:20px;
      margin-top:7px;
      font-size:.78rem;
      color:#64748b;
    }
    .lot-status.error{color:#dc2626}
    .lot-status.ok{color:#059669}
    .hours-btn-group{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:7px;
    }
    .btn-hour{
      min-height:50px;
      border:1.8px solid #cbd5e1;
      border-radius:14px;
      background:#fff;
      color:#334155;
      font-size:1.04rem;
      font-weight:700;
      cursor:pointer;
    }
    .btn-hour.active{
      background:#0d9488;
      color:#fff;
      border-color:#0d9488;
      box-shadow:0 4px 12px rgba(13,148,136,.25);
    }
    .summary-box{
      margin:20px 2px;
      padding:16px 18px;
      border-radius:18px;
      background:#0d9488;
      color:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
    }
    .summary-title{font-weight:700;font-size:.98rem}
    .summary-note{font-size:.75rem;opacity:.82;margin-top:2px}
    .summary-value{
      font-size:1.6rem;
      line-height:1;
      font-weight:700;
      white-space:nowrap;
    }
    .btn-submit{
      width:100%;
      min-height:56px;
      border:0;
      border-radius:16px;
      background:#0d9488;
      color:#fff;
      font-size:1.12rem;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 4px 14px rgba(13,148,136,.32);
    }
    .btn-submit:disabled{
      background:#94a3b8;
      box-shadow:none;
      cursor:not-allowed;
    }

    @media(max-width:390px){
      body{padding:10px 6px}
      .card{padding:18px 14px;border-radius:18px}
      .header-title{font-size:1.35rem}
      .lot-card{padding:14px 12px}
      .btn-hour{font-size:.95rem}
      .summary-value{font-size:1.35rem}
    }
  </style>
</head>

<body>
  <div class="card">
    <div style="text-align:center">
      <div class="factory-badge">👕 FACTORY 2</div>
    </div>

    <h2 class="header-title">🎯 ตั้งเป้าการผลิตประจำวัน</h2>

    <div class="user-banner">
      👤 ผู้รายงาน:
      <span id="userDisplayName">กำลังดึงโปรไฟล์ LINE...</span>
    </div>

    <form id="tgForm">

      <div class="form-group">
        <label for="lineSelect">LINE การผลิต</label>
        <select id="lineSelect" required>
          <option value="">-- เลือก LINE --</option>
          <option value="201">LINE 201</option>
          <option value="202">LINE 202</option>
          <option value="203">LINE 203</option>
          <option value="204">LINE 204</option>
          <option value="205">LINE 205</option>
          <option value="206">LINE 206</option>
        </select>
      </div>

      <div class="form-group">
        <label for="manpower">จำนวนคนในไลน์ (คน)</label>
        <input
          type="number"
          id="manpower"
          min="0"
          step="0.5"
          inputmode="decimal"
          placeholder="เช่น 30 หรือ 30.5"
          required
        >
      </div>

      <div class="lot-card">
        <div class="lot-header">
          <span>📦 LOT ที่เริ่มผลิต</span>
          <span class="rate-badge">Rate: 80 ชิ้น/ชม.</span>
        </div>

        <div class="form-group" style="margin-bottom:0">
          <label for="lotNo">เลข LOT Number</label>
          <input
            type="text"
            id="lotNo"
            placeholder="กรอกเลข LOT"
            autocomplete="off"
            required
          >

          <div id="lotStatus" class="lot-status">
            กรอก LOT เพื่อดูข้อมูล SMPL / Model / Qty
          </div>

          <div id="lotInfo" class="lot-info">
            <div class="lot-info-row">
              <span>SMPL</span>
              <strong id="lotSmpl">-</strong>
            </div>
            <div class="lot-info-row">
              <span>Model</span>
              <strong id="lotModel">-</strong>
            </div>
            <div class="lot-info-row">
              <span>Qty</span>
              <strong id="lotQty">-</strong>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>เวลาทำงานรวม</label>
        <div class="hours-btn-group">
          <button type="button" class="btn-hour active" data-hours="8">8 ชม.</button>
          <button type="button" class="btn-hour" data-hours="9">9 ชม.</button>
          <button type="button" class="btn-hour" data-hours="10">10 ชม.</button>
        </div>
        <input type="hidden" id="selectedHours" value="8">
      </div>

      <div class="summary-box">
        <div>
          <div class="summary-title">เป้าหมายรวมทั้งวัน</div>
          <div class="summary-note">80 ตัว/ชม. × เวลาทำงาน</div>
        </div>
        <div class="summary-value">
          <span id="targetDisplay">640</span> ชิ้น
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        บันทึกเป้าหมาย
      </button>
    </form>
  </div>

<script>
  // ============================================================
  // FACTORY 2 CONFIG
  // หลัง Deploy Apps Script โรง 2 แล้ว ใส่ /exec URL ตรงนี้
  // หลังสร้าง LIFF โรง 2 แล้ว ใส่ LIFF ID ตรงนี้
  // ============================================================
  const SCRIPT_URL = "PASTE_FACTORY2_APPS_SCRIPT_EXEC_URL_HERE";
  const LIFF_ID = "PASTE_FACTORY2_TG_LIFF_ID_HERE";

  const RATE_PER_HOUR = 80;

  let userDisplayName = "Unknown";
  let lastLotLookup = null;
  let lotLookupTimer = null;

  async function initLiff() {
    const userEl = document.getElementById("userDisplayName");

    try {
      if (
        typeof liff === "undefined" ||
        !LIFF_ID ||
        LIFF_ID.includes("PASTE_")
      ) {
        userEl.textContent = "ทั่วไป (ยังไม่ได้ตั้ง LIFF)";
        return;
      }

      await liff.init({ liffId: LIFF_ID });

      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        userDisplayName = profile.displayName || "Unknown";
        userEl.textContent = userDisplayName;
      } else {
        userEl.textContent = "ทั่วไป (ไม่ผ่าน LINE)";
      }
    } catch (err) {
      console.error("LIFF init error", err);
      userEl.textContent = "ทั่วไป";
    }
  }

  function formatNumber(value) {
    return Number(value || 0).toLocaleString("th-TH");
  }

  function updateTarget() {
    const hours = Number(document.getElementById("selectedHours").value) || 8;
    const target = hours * RATE_PER_HOUR;
    document.getElementById("targetDisplay").textContent = formatNumber(target);
  }

  document.querySelectorAll(".btn-hour").forEach(btn => {
    btn.addEventListener("click", () => {
      const hours = Number(btn.dataset.hours);

      document.querySelectorAll(".btn-hour").forEach(x => {
        x.classList.toggle("active", x === btn);
      });

      document.getElementById("selectedHours").value = hours;
      updateTarget();
    });
  });

  function resetLotInfo(message, cls) {
    lastLotLookup = null;
    document.getElementById("lotInfo").classList.remove("show");
    const status = document.getElementById("lotStatus");
    status.textContent = message || "";
    status.className = "lot-status" + (cls ? " " + cls : "");
  }

  async function lookupLot() {
    const input = document.getElementById("lotNo");
    const lot = input.value.trim().toUpperCase();
    input.value = lot;

    if (!lot) {
      resetLotInfo("กรอก LOT เพื่อดูข้อมูล SMPL / Model / Qty");
      return;
    }

    if (
      !SCRIPT_URL ||
      SCRIPT_URL.includes("PASTE_")
    ) {
      resetLotInfo("ยังไม่ได้ใส่ Apps Script /exec URL", "error");
      return;
    }

    const status = document.getElementById("lotStatus");
    status.textContent = "กำลังค้นหา LOT...";
    status.className = "lot-status";

    try {
      const res = await fetch(
        `${SCRIPT_URL}?action=findLot&lot=${encodeURIComponent(lot)}`
      );
      const data = await res.json();

      if (!data.found) {
        resetLotInfo(`ไม่พบ LOT ${lot} ใน Master_Work`, "error");
        return;
      }

      lastLotLookup = data;

      document.getElementById("lotSmpl").textContent = data.smpl || "-";
      document.getElementById("lotModel").textContent = data.model || "-";
      document.getElementById("lotQty").textContent =
        `${formatNumber(data.qty)} ตัว`;

      document.getElementById("lotInfo").classList.add("show");

      status.textContent = "✓ พบข้อมูล LOT";
      status.className = "lot-status ok";

    } catch (err) {
      console.error(err);
      resetLotInfo("ค้นหา LOT ไม่สำเร็จ กรุณาลองใหม่", "error");
    }
  }

  document.getElementById("lotNo").addEventListener("input", () => {
    clearTimeout(lotLookupTimer);
    resetLotInfo("กำลังรอเลข LOT...");

    lotLookupTimer = setTimeout(() => {
      lookupLot();
    }, 450);
  });

  document.getElementById("lotNo").addEventListener("blur", lookupLot);

  document.getElementById("tgForm").addEventListener("submit", async e => {
    e.preventDefault();

    const line = document.getElementById("lineSelect").value;
    const manpowerRaw = document.getElementById("manpower").value.trim();
    const manpower = Number(manpowerRaw);
    const lot = document.getElementById("lotNo").value.trim().toUpperCase();
    const workingHours = Number(document.getElementById("selectedHours").value) || 8;
    const submitBtn = document.getElementById("submitBtn");

    if (!line || manpowerRaw === "" || !lot) {
      alert("กรุณากรอกข้อมูลให้ครบถ้วน");
      return;
    }

    const doubled = manpower * 2;
    const validHalf =
      Number.isFinite(doubled) &&
      Math.abs(doubled - Math.round(doubled)) < 1e-9;

    if (!Number.isFinite(manpower) || manpower < 0 || !validHalf) {
      alert("จำนวนคนกรอกได้เป็นจำนวนเต็มหรือ .5 เช่น 30, 30.5, 31");
      return;
    }

    if (!lastLotLookup || lastLotLookup.lot !== lot) {
      await lookupLot();

      if (!lastLotLookup || lastLotLookup.lot !== lot) {
        alert("กรุณาตรวจสอบ LOT ให้ถูกต้องก่อนบันทึก");
        return;
      }
    }

    if (!SCRIPT_URL || SCRIPT_URL.includes("PASTE_")) {
      alert("ยังไม่ได้ใส่ Apps Script /exec URL");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "กำลังบันทึก...";

    const payload = {
      action: "TG_FORM",
      line,
      manpower,
      lotNumber: lot,
      workingHours,
      updatedBy: userDisplayName
    };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await res.json();

      if (result.status === "success") {
        alert(
          `บันทึกเรียบร้อย\nLINE ${line}\nLOT ${lot}\nเป้าหมาย ${formatNumber(result.target)} ตัว`
        );

        if (
          typeof liff !== "undefined" &&
          liff.isInClient &&
          liff.isInClient()
        ) {
          liff.closeWindow();
        }
      } else {
        alert(
          "เกิดข้อผิดพลาด: " +
          (result.error || "ไม่สามารถบันทึกได้")
        );
      }

    } catch (err) {
      alert("บันทึกไม่สำเร็จ: " + err.message);

    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "บันทึกเป้าหมาย";
    }
  });

  updateTarget();
  initLiff();
</script>
</body>
</html>
